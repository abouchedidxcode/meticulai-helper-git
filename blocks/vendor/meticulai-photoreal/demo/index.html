<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photoreal: a three.js scene that reads as a photograph</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #panel { position: fixed; left: 12px; top: 12px; padding: 10px 12px; background: rgba(0, 0, 0, 0.55); border-radius: 6px; }
      #panel label { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
      #panel input[type='range'] { width: 140px; }
      #panel.hide { display: none; }
      #status { opacity: 0.8; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <div><b>Photoreal</b> <span id="status">loading the sky...</span></div>
      <label>Wet <input id="wet" type="range" min="0" max="1" step="0.01" value="0.55" /></label>
      <label>Exposure <input id="ev" type="range" min="-2" max="2" step="0.05" value="0" /></label>
      <label>Aperture f/<input id="fstop" type="range" min="1.4" max="16" step="0.1" value="4" /><span id="fval">4</span></label>
      <div style="margin-top: 6px; opacity: 0.7">Drag to look around, click to focus, H hides this.<br />?q=low|medium|high|ultra, ?flat=1 (no textures)</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
