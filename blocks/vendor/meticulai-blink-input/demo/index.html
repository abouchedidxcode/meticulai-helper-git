<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blink input</title>
<style>
  :root { color-scheme: dark; --ok: #5fd38d; --bad: #e5484d; --warn: #f2b54a; --dim: #8a90a0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background: #0b0d13; color: #e8e9ee; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 18px; padding: 18px; height: 100vh; }
  .view { position: relative; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .view canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .big { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 0.06em; text-shadow: 0 2px 10px #000; }
  .step { position: absolute; left: 14px; top: 12px; color: var(--dim); font-size: 14px; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: #151924; border-radius: 12px; padding: 12px 14px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .note { color: var(--dim); font-size: 13px; margin: 6px 0 0; }
  .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .row > span:first-child { width: 72px; color: var(--dim); font-size: 13px; }
  .bar { position: relative; flex: 1; height: 14px; background: #262b3a; border-radius: 7px; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--ok); width: 0; }
  .fill.closed { background: var(--bad); }
  .mark { position: absolute; top: 0; bottom: 0; width: 2px; }
  .mark.close { background: #fff; }
  .mark.open { background: #9aa3ff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 9px; border-radius: 999px; background: #262b3a; color: var(--dim); font-size: 13px; }
  .chip.on { background: var(--bad); color: #fff; }
  .chip.ok { background: #1f4a33; color: #c9f5da; }
  .gaze { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gaze div { text-align: center; padding: 4px; border-radius: 6px; background: #262b3a; color: var(--dim); font-size: 13px; }
  .gaze div.on { background: #3b6b8f; color: #fff; }
  button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 0; background: #3b5bdb; color: #fff; cursor: pointer; }
  button.secondary { background: #262b3a; color: #e8e9ee; }
  button:disabled { opacity: 0.5; cursor: default; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  #log { flex: 1; min-height: 80px; overflow: auto; margin: 0; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #c6cad6; white-space: pre; }
  .nums { font: 12px ui-monospace, Menlo, monospace; color: var(--dim); }
  #hold { user-select: none; touch-action: none; }
</style>
</head>
<body>
<main>
  <div class="view">
    <canvas id="view" width="960" height="720"></canvas>
    <div class="step" id="step"></div>
    <div class="big" id="big">EYES OPEN</div>
  </div>
  <div class="side">
    <div class="card">
      <h1>Blink input</h1>
      <div class="buttons">
        <button id="cam">Use my camera</button>
        <button id="synth" class="secondary">Try without a camera</button>
        <button id="calib" class="secondary" disabled>Calibrate</button>
      </div>
      <p class="note">Your camera video stays on this device. Nothing is recorded or sent anywhere.</p>
      <p class="note" id="status">No camera: hold Space, or hold the button below, to close your eyes.</p>
      <div class="buttons" style="margin-top:8px"><button id="hold" class="secondary">Hold to close eyes</button></div>
    </div>
    <div class="card">
      <div class="row"><span>Left eye</span><div class="bar"><div class="fill" id="fillL"></div><div class="mark close" id="closeL"></div><div class="mark open" id="openL"></div></div></div>
      <div class="row"><span>Right eye</span><div class="bar"><div class="fill" id="fillR"></div><div class="mark close" id="closeR"></div><div class="mark open" id="openR"></div></div></div>
      <div class="chips" style="margin-top:8px">
        <span class="chip" id="cClosed">eyes closed</span>
        <span class="chip" id="cAway">looking away</span>
        <span class="chip" id="cBlind">blind</span>
        <span class="chip" id="cSource">keyboard</span>
      </div>
      <div class="gaze" style="margin-top:8px"><div id="gL">left</div><div id="gC">centre</div><div id="gR">right</div></div>
      <div class="nums" id="nums" style="margin-top:8px"></div>
    </div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0">
      <div class="note" style="margin:0 0 6px">Events</div>
      <pre id="log"></pre>
    </div>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
