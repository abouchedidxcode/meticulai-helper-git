<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ripple water</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a3a2c; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: #f2ecd8; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; left: 16px; bottom: 14px; pointer-events: none; opacity: 0.85; text-shadow: 0 1px 2px #0008; }
    #hud b { font-weight: 650; }
  </style>
</head>
<body>
  <div id="hud"><b>Hover</b>: where you would touch &nbsp; <b>Hold and drag</b>: a finger through the water &nbsp; <b>Double-click</b>: splash &nbsp; <b>C</b>: calm</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
