<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realistic Procedural Dungeons</title>
<link rel="icon" href="data:,">
<style>
	html, body { margin: 0; height: 100%; background: #050507; overflow: hidden; color: #f2efe8; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
	#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
	#hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 8px 12px; background: #0009; border-radius: 6px; pointer-events: none; }
	.off { display: none; }
	#cover { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #050507; }
	#cover.off { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hint">Click to look around. WASD to walk, Shift to run.</div>
<div id="cover">Loading</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
